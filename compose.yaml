services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: transport_demo
      POSTGRES_PASSWORD: ${TRANSPORT_DB_PASSWORD:?Définir TRANSPORT_DB_PASSWORD dans .env}
    volumes:
      - transport-data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d transport_demo"]
      interval: 3s
      timeout: 3s
      retries: 25
  api:
    build: ./src/Transport.Api
    environment:
      Transport__SandboxPayments: ${TRANSPORT_SANDBOX_PAYMENTS:-false}
      Transport__AdminSeal: ${TRANSPORT_ADMIN_SEAL:-}
      Transport__Access: ${TRANSPORT_ACCESS:-Demo}
      ConnectionStrings__Transport: "Host=db;Database=transport_demo;Username=postgres;Password=${TRANSPORT_DB_PASSWORD}"
    ports:
      - "127.0.0.1:${TRANSPORT_PORT:-5080}:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  transport-data:
