<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Ouverture de compagnie · Éditeur</title><link rel="stylesheet" href="../administration/admin.css"><script src="opening.js" defer></script>
</head><body><header><strong>Espace éditeur</strong><button id="exit" hidden>Fermer la session</button></header>
<main><h1>Ouvrir une compagnie</h1>
<form id="access"><label>Clé de mandat<input name="key" type="password" required autocomplete="off" minlength="64" maxlength="64"></label><button>Accéder au mandat</button></form>
<p id="identity" hidden></p>
<form id="opening" hidden>
<label>Nom commercial<input name="company" required maxlength="120"></label>
<label>Raison sociale<input name="entity" required maxlength="120"></label>
<label>Code pays<input name="country" required value="CI" pattern="[A-Za-z]{2}" maxlength="2"></label>
<label>Première agence<input name="agency" required maxlength="120"></label>
<label>Arrêt de rattachement<select name="station" required></select></label>
<button>Ouvrir la compagnie</button></form>
<p id="status" role="status" aria-live="polite"></p><p><a href="support.html">Consulter un diagnostic autorisé</a></p></main></body></html>
